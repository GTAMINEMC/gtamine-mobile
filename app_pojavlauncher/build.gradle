plugins {
    id 'com.android.application' version '9.3.1'
}

import java.util.Locale

static def getDate() { return new Date().format('yyyyMMdd') }

// The GTAMINE release key is deliberately kept outside version control.  A
// developer's local `gtamine-signing.properties` file supplies its path and
// credentials, while CI may provide the same values as environment variables.
def gtamineSigningProperties = new Properties()
def gtamineSigningPropertiesFile = file('gtamine-signing.properties')
if (gtamineSigningPropertiesFile.canRead()) {
    gtamineSigningPropertiesFile.withInputStream { gtamineSigningProperties.load(it) }
}
def gtamineSigningValue = { String name ->
    return System.getenv("GTAMINE_${name.toUpperCase(Locale.ROOT)}")
            ?: gtamineSigningProperties.getProperty(name)
}

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'gtamine-mobile-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'com.gtamine.mobile'

    compileSdk = 37


    signingConfigs {
        gtamineRelease {
            def storePath = gtamineSigningValue('storeFile')
            def storePass = gtamineSigningValue('storePassword')
            def alias = gtamineSigningValue('keyAlias')
            def keyPass = gtamineSigningValue('keyPassword')
            if (storePath != null && storePass != null && alias != null && keyPass != null) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            storeFile file("aamc_upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "android_github_release"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        // A dedicated package lets GTAMINE Mobile coexist with PojavLauncher
        // and prevents Android provider-authority conflicts during install.
        applicationId "com.gtamine.mobile"
        minSdkVersion 21
        targetSdkVersion 34
        // Keep the Android update number monotonic while showing a simple
        // public version to players.
        versionCode 10000001
        versionName "1.0"
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.gtamineRelease
            resValue "string", "app_name", "GTAMINE Mobile"
            resValue "string", "app_short_name", "GTAMINE Mobile"
            resValue 'string', 'application_package', 'com.gtamine.mobile.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.gtamine.mobile.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.gtamine.mobile.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.gtamineRelease
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "GTAMINE Mobile"
            resValue "string", "app_short_name", "GTAMINE Mobile"
            resValue 'string', 'storageProviderAuthorities', 'com.gtamine.mobile.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.gtamine.mobile'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so', '**/libxdl.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

