name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create (for example, v1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GTAMINE_STOREFILE: gtamine-release.jks
      GTAMINE_STOREPASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      GTAMINE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      GTAMINE_KEYPASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Validate release inputs and signing secrets
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "tag_name must be a valid tag, for example v1.0.0" >&2
            exit 1
          fi
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required GitHub secret for Android signing: $secret_name" >&2
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Android release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app_pojavlauncher/gtamine-release.jks

      - name: Download bundled JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare generated language list
        run: bash scripts/languagelist_updater.sh

      - name: Build signed release APK
        run: gradle :app_pojavlauncher:assembleRelease

      - name: Prepare release files
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk "out/GTAMINE-Mobile-${TAG_NAME}.apk"
          cd out
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: GTAMINE Mobile ${{ inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            ## Установка на Android

            1. Скачайте APK-файл ниже на Android-устройство.
            2. Откройте скачанный файл. Если Android попросит разрешение, разрешите установку приложений для браузера или файлового менеджера, которым вы открыли APK.
            3. Подтвердите установку и запустите **GTAMINE Mobile**.

            Чтобы обновить приложение, устанавливайте APK поверх предыдущей версии. Если Android сообщает о конфликте подписи, удалите старую версию и установите эту заново. Перед удалением сохраните нужные файлы игры.

            Контрольная сумма SHA-256 находится в `SHA256SUMS.txt`.
